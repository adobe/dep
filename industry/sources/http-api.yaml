# Data load entry format for standard/data-load.yaml when using this source:
#
#   schemas:
#     <schema-key>:            # array — one item per file to stream for this schema
#       - mode: single | multi # single = one JSON object; multi = JSON array
#         file: sample-data/<file>.json
#         mappingSet: mapping-sets/<file>.json
#
#   Single-file schema (most schemas):
#     store-lookup:
#       - mode: multi
#         file: sample-data/store_lookup.json
#         mappingSet: mapping-sets/store-lookup.json
#
#   Multi-file schema (multiple data files targeting the same schema):
#     customer-account:
#       - mode: single
#         file: sample-data/depeche-mode-profile/customer_account.json
#         mappingSet: mapping-sets/customer-account.json
#       - mode: multi
#         file: sample-data/stranger-things-profiles/sample-profiles.json
#         mappingSet: mapping-sets/customer-account.json
#
#   Each array item streams independently to the same dataset using its own file.
#   Multiple items may share a mapping set when the source schema shape is identical.

